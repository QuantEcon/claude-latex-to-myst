name: test

# Phase 1 keystone gate (docs/design/phase-1-validation-gate.md).
#
# Triggers on BOTH push and pull_request deliberately: the architecture
# evolution lands as one PR after five phase commits, so a pull_request-only
# trigger would leave commits 2–5 unguarded on the branch. push coverage means
# every phase commit is CI-checked the moment it is pushed.
on:
  push:
  pull_request:

env:
  # Pandoc output is version-sensitive — pin it so golden_tex / differential
  # fixtures don't churn on runner upgrades. Bump deliberately, regenerating
  # the golden corpus in the same commit. Keep in lock-step with the version
  # the maintainers run locally.
  PANDOC_VERSION: "3.8"
  # The render gate (#151) builds against the QuantEcon/mystmd FORK, not
  # upstream npm mystmd: the committed build baselines
  # (tests/baselines/build-*.txt) assume fork behavior (qe-v5 book-mode
  # numbering, fancy lists from QuantEcon/mystmd#50, the cite-scanner fix
  # from QuantEcon/mystmd#53). A SHA or qe-vN tag on QuantEcon/mystmd.
  # Bump deliberately, re-validating the three build baselines with the
  # new ref in the same commit — never let runner drift pick the version.
  MYSTMD_REF: "d1a942cae177120a5ddad49fe30b02d1ad583553"  # v1.10.1 (qe-v8)

jobs:
  # Job 1 — the merge blocker. Unit suite + both golden tiers
  # (tests/golden, tests/golden_tex) + the §1b differential gate. Pandoc
  # pinned. Self-contained: no external fixtures, runs on every push & PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned pandoc ${{ env.PANDOC_VERSION }}
        run: |
          set -euo pipefail
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${deb}"
          curl -fsSL -o "$deb" "$url"
          sudo dpkg -i "$deb"
          got="$(pandoc --version | head -1 | awk '{print $2}')"
          echo "pandoc $got"
          test "$got" = "${PANDOC_VERSION}" || { echo "pandoc version mismatch: $got != ${PANDOC_VERSION}"; exit 1; }

      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync

      - name: Run test suite (unit + golden + golden_tex + differential)
        run: uv run pytest -q

  # Job 2 — deeper, label-gated, allowed-to-be-flaky (NOT a merge blocker).
  # Clones the real consumer books and (a) diffs validate.py counts against
  # the committed tests/baselines/*.json (Phase 1 §2b), then (b) runs the
  # render gate (#151): build_smoke.py overlays each book's regen onto its
  # worked-on mystmd/ project, runs `myst build --html` with the pinned
  # QuantEcon/mystmd fork build, and multiset-diffs normalized warnings
  # against tests/baselines/build-<book>.txt (dp1's empty baseline = the
  # zero-warning contract). It needs fixture access (private repos)
  # supplied via secrets, so it is skipped unless the `fixture-check`
  # label is present AND the secrets are configured. The curated golden
  # corpus in Job 1 is the real blocker; this job documents the per-book
  # count + render surface and catches whole-book drops.
  fixture-counts:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'fixture-check')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned pandoc ${{ env.PANDOC_VERSION }}
        run: |
          set -euo pipefail
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${deb}"
          curl -fsSL -o "$deb" "$url"
          sudo dpkg -i "$deb"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync

      # The fork CLI bundles to a single self-contained dist/myst.cjs
      # (no runtime deps), so caching that one artifact keyed on the ref
      # skips the whole clone + bun + turbo build on repeat runs.
      - name: Cache built mystmd fork
        id: mystmd-cache
        uses: actions/cache@v4
        with:
          path: ~/.mystmd-dist
          key: mystmd-${{ env.MYSTMD_REF }}

      # Pinned to the fork's own packageManager declaration
      # (package.json: "packageManager": "bun@1.3.10") — same
      # no-runner-drift policy as PANDOC_VERSION / MYSTMD_REF.
      - name: Install bun (build toolchain for the mystmd fork)
        if: steps.mystmd-cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Build QuantEcon/mystmd @ pinned ref
        if: steps.mystmd-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          # init + fetch (not clone --branch) so MYSTMD_REF can be either
          # a qe-vN tag or a bare commit SHA — GitHub serves both.
          git -C "$src" init -q
          git -C "$src" remote add origin https://github.com/QuantEcon/mystmd.git
          git -C "$src" fetch -q --depth 1 origin "$MYSTMD_REF"
          git -C "$src" checkout -q FETCH_HEAD
          (cd "$src" && bun install --frozen-lockfile && bun run build)
          mkdir -p "$HOME/.mystmd-dist"
          cp "$src/packages/mystmd/dist/myst.cjs" "$HOME/.mystmd-dist/"

      - name: Put pinned myst on PATH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec node "$HOME/.mystmd-dist/myst.cjs" "$@"\n' > "$HOME/.local/bin/myst"
          chmod +x "$HOME/.local/bin/myst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/myst" --version

      - name: Clone fixtures + diff counts/build warnings vs committed baselines
        env:
          # GitHub clone URLs (with embedded token) for the consumer books.
          # Unset ⇒ this job no-ops (it cannot clone private repos without them).
          BOOK_DP1_SRC: ${{ secrets.BOOK_DP1_URL }}
          BOOK_DP2_SRC: ${{ secrets.BOOK_DP2_URL }}
          BOOK_DL_SRC: ${{ secrets.BOOK_DL_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BOOK_DP1_SRC:-}" ]; then
            echo "fixture clone URLs not configured (secrets unset) — skipping."
            exit 0
          fi
          bash scripts/setup_fixtures.sh
          fail=0
          for b in dp1 dp2 deep-learning; do
            case "$b" in
              dp1) d=book-dp1 ;;
              dp2) d=book-dp2 ;;
              deep-learning) d=book-dp-deep-learning ;;
            esac
            bash scripts/convert.sh --config "fixtures/$d/regen/config.yaml" >/dev/null 2>&1 || true
            uv run python scripts/count_baseline.py \
              --config "fixtures/$d/regen/config.yaml" --book "$b" \
              --check "tests/baselines/$b.json" || fail=1
            # Render gate (#151): regen must build with warnings matching
            # the committed baseline (multiset diff — any NEW line fails).
            uv run python scripts/build_smoke.py \
              --fixture "fixtures/$d" \
              --check "tests/baselines/build-$b.txt" || fail=1
          done
          exit "$fail"
