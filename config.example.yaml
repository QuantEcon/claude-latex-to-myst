# =============================================================================
# claude-latex-to-myst — per-project configuration
# =============================================================================
#
# Copy this file to your book repo (e.g. as mystmd/config.yaml) and edit.
# All paths are resolved relative to the directory containing this config file.
#
# The config drives:
#   - which chapters get converted
#   - frontmatter titles for each chapter
#   - what bib file to copy
#   - which custom LaTeX macros to rewrite before pandoc
#   - which figures live where
#   - the TikZ-resolution map (optional; loaded from a .py file)
# =============================================================================

# --- Source layout ----------------------------------------------------------

# Directory containing the .tex source files, relative to this config file.
source_dir: ".."

# Directory where MyST output is written. Usually the directory containing
# this config.
output_dir: "."

# Working directory for preprocessed .tex + raw pandoc output. Gitignore this.
tmp_dir: "./tmp"

# --- Chapters ---------------------------------------------------------------

# List of chapter stems (without .tex extension), in book order. Each entry
# becomes a {stem}.tex → {stem}.md conversion.
#
# `title` is used as the chapter heading and YAML frontmatter title in the
# generated .md file.
chapters:
  - stem: ch01_intro
    title: "Introduction"
  - stem: ch02_foundations
    title: "Foundations"
  # ... add one entry per chapter
  #
  # Per-chapter overrides (optional):
  #   frontmatter_style: absorbed   # or 'standalone' — overrides the
  #                                 # global default for this stem only.
  #                                 # Useful for books that mix conventions
  #                                 # (e.g. numbered chapters standalone,
  #                                 # front-matter absorbed).

# Front- and back-matter files that should also be converted but live outside
# the numbered chapter sequence. These do not appear in TOC numbering.
extra_files:
  - stem: preface
    title: "Preface"
  - stem: common_symbols
    title: "Notation"
  # extra_files entries accept the same `frontmatter_style:` override as
  # `chapters:` entries.
  #
  # ``regen: false`` opts a file out of the regen flow. convert.sh
  # skips preprocess + pandoc + postprocess for the stem, leaving any
  # curated copy in ``output_dir`` untouched. Use for front-matter pages
  # whose Markdown has diverged from the LaTeX source through editorial
  # rewrites that can't be expressed as ``postprocess.rewrites``. The
  # stem remains in ``myst.yml``'s TOC and renders normally (#63).
  #
  # Example:
  #   - { stem: common_symbols, title: "Symbols", regen: false }
  #
  # ``regen: false`` is also accepted on ``chapters:`` entries; passing
  # the stem explicitly on the convert.sh CLI bypasses the gate for
  # stages 2+ (useful for an occasional force-regen).

# --- Environments (extend the defaults) -------------------------------------

# Pandoc emits LaTeX environments like ``\begin{conjecture}...\end{conjecture}``
# as ``::: conjecture ... :::`` divs in markdown. The pipeline knows the
# common ones (theorem, lemma, definition, proposition, corollary, example,
# remark, assumption, algorithm, proof, Exercise, Answer) — see ENV_MAP in
# scripts/postprocess.py for the full default list.
#
# Use ``extra_environments`` to add project-specific ones. Keys are the
# pandoc div name (the LaTeX environment); values are the MyST directive
# they should become. Common targets: any sphinx-proof type (prf:theorem,
# prf:lemma, prf:remark, etc.) or built-in MyST directives.
#
# extra_environments:
#   Conjecture: prf:conjecture
#   Notation:   prf:remark
#   Fact:       prf:theorem

# Use ``skip_environments`` to silently strip wrapper divs that have no
# MyST equivalent (the content is kept, the wrapper is removed). The
# default list already handles ``multicols``, ``minipage``, ``center``.
#
# skip_environments:
#   - columns
#   - framed

# --- Frontmatter style ------------------------------------------------------

# Two valid MyST conventions for the chapter heading + label:
#
#   absorbed (default):                   standalone:
#     ---                                   (c-foo)=
#     title: "Foo"                          # Foo
#     label: c-foo
#     ---
#
# Both work for MyST cross-references; pick whichever your project uses.
# Default is ``absorbed``. Existing books that use the standalone form (e.g.,
# book-dp1) should set this to ``standalone``.
#
# frontmatter_style: absorbed

# --- Whitespace compression -------------------------------------------------

# Whether to keep or strip blank lines between adjacent fenced directives:
#
#   readable (default):                    compact:
#     ```                                    ```
#                                            ```{exercise}
#     ```{exercise}                          :label: ex-foo
#     :label: ex-foo                         ...
#     ...                                    ```
#     ```
#
# MyST renders both identically. ``compact`` is opt-in for projects that
# want denser source. Note: this only strips blanks between adjacent
# ``` fences — it does not touch blanks after ``:label:`` or around
# ``(label)=`` anchors, since matching dp1's hand-tuned spacing exactly
# would require preserving the original LaTeX source-spacing through
# pandoc, which is out of scope for this tool.
#
# whitespace_compression: readable

# --- Source code (minted listings) ------------------------------------------

# Base directory for resolving paths inside ``\inputminted{lang}{path}``.
# Defaults to ``source_dir``. Override if your source code lives outside
# the LaTeX source tree.
#
# Example dp1 layout:
#   book/
#     ch_intro.tex    contains \inputminted{julia}{../source_code_jl/s_approx.jl}
#   source_code_jl/
#     s_approx.jl
#
# With ``source_dir: book`` and the default, ``source_code_base`` resolves
# to ``book/``, and ``../source_code_jl/s_approx.jl`` correctly points to
# the file. Set explicitly if you want listings to be anchored elsewhere.
#
# source_code_base: "."

# --- Bibliography -----------------------------------------------------------

# Source .bib file (relative to source_dir). Copied to {output_dir}/references.bib.
bibliography: "references.bib"

# --- Figures ----------------------------------------------------------------

# Directory of pre-rendered figures (relative to source_dir). Copied to
# {output_dir}/figures/. Set to null to skip copying.
figures_dir: "figures"

# --- LaTeX pre-processing ---------------------------------------------------
#
# Patterns are Python regexes (re module syntax), applied via re.sub to a copy
# of each .tex file in tmp_dir. The originals are never modified.
#
# YAML quoting: use single-quoted strings so backslashes don't need to be
# doubled (`'\\index\{...\}'` produces the regex `\\index\{...\}` — a literal
# backslash + `index`). Double-quoted YAML strings would require `"\\\\..."`.
#
# Use this for:
#   - Custom macros pandoc can't handle (e.g., `\navy{...}` → `\textbf{...}`)
#   - Stripping presentational commands (\index, \vspace, \clearpage)
#   - Unwrapping wrapping commands (\scalebox)
#   - Replacing \input{tikz/...} with a placeholder

preprocess:
  # Split consolidated multi-chapter .tex files (e.g. one ``appendix.tex``
  # bundling several ``\chapter{}`` blocks) into per-chapter pieces. Each
  # entry copies ``source_dir/{source}.tex`` to the tmp dir, splits at
  # ``\chapter{...}`` boundaries, and writes the first N sections to the
  # stems listed in ``into``.
  #
  # The split runs *before* per-chapter rewrites; each output stem is
  # then processed as a normal chapter (apply rewrites + algorithm /
  # listing markers). The output stems must appear in ``chapters:`` /
  # ``extra_files:`` to be picked up by pandoc.
  #
  # ``skip_extra: true`` discards trailing ``\chapter`` blocks beyond
  # ``into``; without it the splitter errors so accidental drops are
  # surfaced. Use it deliberately (e.g. dp1's third appendix is just
  # ``\shipoutAnswer`` and has no usable content).

  # split:
  #   - source: appendix
  #     into: [appA, appB]
  #     skip_extra: true

  # Patterns to delete (replaced with empty string)
  strip:
    - '\\index\{[^}]*\}'
    - '\\clearpage'
    - '\\newpage'
    - '\\noindent'
    - '\\vspace\{[^}]*\}'

  # Search-and-replace rules. Use \1, \2 for capture group backreferences.
  # Each entry: { from: regex, to: replacement }
  rewrites:
    # Example from book-dp2: \navy{text} → \textbf{text}
    # - { from: '\\navy\{', to: '\\textbf{' }

    # Unwrap \scalebox{N}{\includegraphics{...}}
    # - { from: '\\scalebox\{[0-9.]+\}\s*\{\s*(\\includegraphics[^}]*\{[^}]*\})\s*\}',
    #     to: '\1' }

    # Hoist \label out of algorithm \caption{} so pandoc preserves it
    # - { from: '\\caption\{\\label\{(algo:[^}]+)\}\s*([^}]*)\}',
    #     to: '\\label{\1}\\caption{\2}' }

# --- Post-pandoc Markdown rewrites (book-specific editorial fixes) ----------
#
# `preprocess.rewrites` (above) operates on .tex source BEFORE pandoc.
# `postprocess.rewrites` operates on the final .md AFTER all generic
# transforms (including frontmatter emission). Use this for editorial
# decisions the tool can't infer from LaTeX — e.g. promoting a book's
# `**Bold heading**` pseudo-section to a real `## H2`, only in the
# specific chapters where the pattern is known to be a heading.
#
# Each entry: { from: regex, to: replacement, stems?: [stem1, stem2] }
#   - `from`/`to`: same shape as preprocess.rewrites; backrefs allowed.
#   - Patterns compile with `re.MULTILINE` so `^...$` matches lines.
#   - `stems:` optional. When present, the rewrite is scoped to those
#     stems (must match a `stem:` declared in `chapters:` or
#     `extra_files:`). Omit for a global rewrite.
#   - Order in the list = order of application; a later rewrite sees
#     the output of earlier ones.
#
# No block-aware exclusion: rewrites apply to the whole Markdown
# (including inside fenced code blocks and `$$` display math). Rely on
# pattern specificity and `stems:` to keep matches targeted.

# postprocess:
#   rewrites:
#     # Targeted promotion (only fires in common_symbols.md)
#     - { stems: [common_symbols],
#         from:  '^\*\*Mathematical Notation\*\*$',
#         to:    '## Mathematical Notation' }
#     # Global Markdown fix (every chapter)
#     - { from: '\bSI\b', to: 'System I' }

# --- TikZ handling ----------------------------------------------------------

# `\input{tikz/...}` references are replaced with placeholder admonitions
# during preprocessing. The post-processor then resolves them to figure
# directives using a Python overrides file.
#
# Path is relative to this config file. The file should define:
#   TIKZ_FIGURE_MAP = { "label": ("path/to/image.svg", "optional caption") }
#   TIKZCD_INLINE_MAP = { "chapter_stem": [ ... regex entries ... ] }
#
# Set to null if your book has no TikZ.
tikz_overrides: "tikz_overrides.py"

# --- Validation -------------------------------------------------------------

# Structural checks to run after conversion (see scripts/validate.py).
# Each check counts the construct in the LaTeX source and the MyST output
# and reports any mismatch.
validate:
  equations: true
  cross_references: true
  theorems: true
  figures: true
  citations: true
  # Scan MyST output for inline math (``$...$``) split across a newline
  # where the next line opens with ``>`` (MyST blockquote marker) or
  # another stray ``$`` — patterns that silently break rendering.
  broken_inline_math: true
