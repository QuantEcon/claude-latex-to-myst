# =============================================================================
# claude-latex-to-myst — per-project configuration
# =============================================================================
#
# Copy this file to your book repo (e.g. as mystmd/config.yaml) and edit.
# All paths are resolved relative to the directory containing this config file.
#
# The config drives:
#   - which chapters get converted
#   - frontmatter titles for each chapter
#   - what bib file to copy
#   - which custom LaTeX macros to rewrite before pandoc
#   - which figures live where
#   - the TikZ-resolution map (optional; loaded from a .py file)
# =============================================================================

# --- Source layout ----------------------------------------------------------

# Directory containing the .tex source files, relative to this config file.
source_dir: ".."

# Directory where MyST output is written. Usually the directory containing
# this config.
output_dir: "."

# Working directory for preprocessed .tex + raw pandoc output. Gitignore this.
tmp_dir: "./tmp"

# --- Chapters ---------------------------------------------------------------

# List of chapter stems (without .tex extension), in book order. Each entry
# becomes a {stem}.tex → {stem}.md conversion.
#
# `title` is used as the chapter heading and YAML frontmatter title in the
# generated .md file.
chapters:
  - stem: ch01_intro
    title: "Introduction"
  - stem: ch02_foundations
    title: "Foundations"
  # ... add one entry per chapter

# Front- and back-matter files that should also be converted but live outside
# the numbered chapter sequence. These do not appear in TOC numbering.
extra_files:
  - stem: preface
    title: "Preface"
  - stem: common_symbols
    title: "Notation"

# --- Bibliography -----------------------------------------------------------

# Source .bib file (relative to source_dir). Copied to {output_dir}/references.bib.
bibliography: "references.bib"

# --- Figures ----------------------------------------------------------------

# Directory of pre-rendered figures (relative to source_dir). Copied to
# {output_dir}/figures/. Set to null to skip copying.
figures_dir: "figures"

# --- LaTeX pre-processing ---------------------------------------------------
#
# Patterns are Python regexes (re module syntax), applied via re.sub to a copy
# of each .tex file in tmp_dir. The originals are never modified.
#
# YAML quoting: use single-quoted strings so backslashes don't need to be
# doubled (`'\\index\{...\}'` produces the regex `\\index\{...\}` — a literal
# backslash + `index`). Double-quoted YAML strings would require `"\\\\..."`.
#
# Use this for:
#   - Custom macros pandoc can't handle (e.g., `\navy{...}` → `\textbf{...}`)
#   - Stripping presentational commands (\index, \vspace, \clearpage)
#   - Unwrapping wrapping commands (\scalebox)
#   - Replacing \input{tikz/...} with a placeholder

preprocess:
  # Patterns to delete (replaced with empty string)
  strip:
    - '\\index\{[^}]*\}'
    - '\\clearpage'
    - '\\newpage'
    - '\\noindent'
    - '\\vspace\{[^}]*\}'

  # Search-and-replace rules. Use \1, \2 for capture group backreferences.
  # Each entry: { from: regex, to: replacement }
  rewrites:
    # Example from book-dp2: \navy{text} → \textbf{text}
    # - { from: '\\navy\{', to: '\\textbf{' }

    # Unwrap \scalebox{N}{\includegraphics{...}}
    # - { from: '\\scalebox\{[0-9.]+\}\s*\{\s*(\\includegraphics[^}]*\{[^}]*\})\s*\}',
    #     to: '\1' }

    # Hoist \label out of algorithm \caption{} so pandoc preserves it
    # - { from: '\\caption\{\\label\{(algo:[^}]+)\}\s*([^}]*)\}',
    #     to: '\\label{\1}\\caption{\2}' }

# --- TikZ handling ----------------------------------------------------------

# `\input{tikz/...}` references are replaced with placeholder admonitions
# during preprocessing. The post-processor then resolves them to figure
# directives using a Python overrides file.
#
# Path is relative to this config file. The file should define:
#   TIKZ_FIGURE_MAP = { "label": ("path/to/image.svg", "optional caption") }
#   TIKZCD_INLINE_MAP = { "chapter_stem": [ ... regex entries ... ] }
#
# Set to null if your book has no TikZ.
tikz_overrides: "tikz_overrides.py"

# --- Validation -------------------------------------------------------------

# Structural checks to run after conversion (see scripts/validate.py).
# Each check counts the construct in the LaTeX source and the MyST output
# and reports any mismatch.
validate:
  equations: true
  cross_references: true
  theorems: true
  figures: true
  citations: true
