[project]
name = "claude-latex-to-myst"
version = "0.1.0"
description = "Reusable pandoc + post-processing pipeline for converting academic LaTeX to high-fidelity MyST Markdown."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/QuantEcon/claude-latex-to-myst"

[tool.uv]
package = false   # this is a tool repo, not a distributable library

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
